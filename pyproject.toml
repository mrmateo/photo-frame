[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-frame"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.10.0",
  "requests>=2.32.0",
  "Pillow>=11.0.0",
  "pillow-heif>=0.22.0",
]

[tool.setuptools]
packages = ["photoframe"]

[tool.setuptools.dynamic]
version = {attr = "photoframe.__version__"}

[tool.pyside6-project]
files = [
  "main.py",
  "resources.qrc",
  "qml/Main.qml",
  "qml/Slideshow.qml",
  "qml/InfoPanel.qml",
  "photoframe/__init__.py",
  "photoframe/config.py",
  "photoframe/http_client.py",
  "photoframe/manifest.py",
  "photoframe/metadata.py",
  "photoframe/presentation.py",
  "photoframe/controller.py",
  "photoframe/cropping.py",
  "photoframe/photo_sync_service.py",
  "photoframe/weather_service.py",
  "photoframe/weather_types.py",
]
